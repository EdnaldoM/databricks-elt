databricks_elt:
  target: dev
  outputs:
    dev:
      type: databricks
      host: "{{ env_var('DATABRICKS_HOST') }}"
      http_path: "{{ env_var('DATABRICKS_HTTP_PATH') }}"
      token: "{{ env_var('DATABRICKS_TOKEN') }}"
      database: workspace
      schema: "{{ env_var('PERSONAL_SCHEMA') }}"
      # catalog: your_unity_catalog_name # Uncomment if using Unity Catalog
    # prod:
    #   type: databricks
    #   host: ...
    #   http_path: ...
    #   token: "{{ env_var('DBT_PROD_ACCESS_TOKEN') }}"
    #   schema: your_prod_schema